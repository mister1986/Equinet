<script>
const STATIC_CONFIG = JSON.parse(document.getElementById('static-config').textContent);
const PROOF1 = "https://d2ol7oe51mr4n9.cloudfront.net/user_3HuteLW03emt9uCkHpZfhwZDVdU/e36c1a66-a675-40c3-9c2e-f61e02bc09bf.jpg";
const PROOF2 = "https://d2ol7oe51mr4n9.cloudfront.net/user_3HuteLW03emt9uCkHpZfhwZDVdU/afd56da3-b5e2-40b3-90c1-1fb8a6c0c127.jpg";
const PROOF3 = "https://d2ol7oe51mr4n9.cloudfront.net/user_3HuteLW03emt9uCkHpZfhwZDVdU/f4351ee5-6b93-4524-973d-ebaa751913da.jpg";
const PROOF4 = "https://d2ol7oe51mr4n9.cloudfront.net/user_3HuteLW03emt9uCkHpZfhwZDVdU/6ad7f99f-eb48-478a-9f32-d22892fdcaa0.jpg";
const CTA_PHONE = "https://d2ol7oe51mr4n9.cloudfront.net/user_3HuteLW03emt9uCkHpZfhwZDVdU/97036065-1377-463a-a3c9-7fb22a8c4409.jpg";

const EDITOR_COLORS = { mk: '#c0392b', faezeh: '#e07b1a', manager: '#0057B8' };
const FIELD_LIST = ["h_on","h_vo","p_on","p_vo","s_on","s_vo","proof_on","proof_vo","b_on","b_vo","cta_vo"];
const APPROVAL_FIELDS = ["mkApproved","faezehApproved","managerApproved"];
const CSV_COLUMNS = ["row", ...APPROVAL_FIELDS, ...FIELD_LIST, ...FIELD_LIST.map(f => f + "_editor")];

let ads = [];
let currentStatus = 'All';
let currentApprover = 'All';
let currentCategory = 'All';

async function loadDatabase() {
  try {
    const res = await fetch('/api/data');
    if (!res.ok) throw new Error('bad response: ' + res.status);
    const data = await res.json();
    csvToAds(data.csv);
    setDbStatus(true, 'Connected');
  } catch (err) {
    console.error(err);
    setDbStatus(false, 'Cannot reach the database right now');
  }
}

function csvToAds(csvText) {
  const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
  parsed.data.forEach(r => {
    const ad = ads.find(a => a.row === parseInt(r.row));
    if (!ad) return;
    APPROVAL_FIELDS.forEach(f => { ad[f] = (String(r[f]).toUpperCase() === 'TRUE'); });
    FIELD_LIST.forEach(f => {
      if (r[f]) ad[f] = r[f];
      if (r[f + '_editor']) ad[f + '_editor'] = r[f + '_editor'];
    });
  });
}

function adsToCsv() {
  const rows = ads.map(ad => {
    const r = { row: ad.row };
    APPROVAL_FIELDS.forEach(f => { r[f] = ad[f] ? 'TRUE' : 'FALSE'; });
    FIELD_LIST.forEach(f => {
      r[f] = ad[f] || '';
      r[f + '_editor'] = ad[f + '_editor'] || '';
    });
    return r;
  });
  return Papa.unparse({ fields: CSV_COLUMNS, data: rows });
}

let saveQueue = Promise.resolve();
function queueSave(message) {
  saveQueue = saveQueue.then(() => writeDatabase(message)).catch(e => console.error(e));
  return saveQueue;
}

async function writeDatabase(message) {
  const flash = document.getElementById('savedFlash');
  try {
    const res = await fetch('/api/save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ csv: adsToCsv(), message })
    });
    const data = await res.json();
    if (res.status === 409 || data.conflict) {
      const reload = await fetch('/api/data');
      const reloadData = await reload.json();
      csvToAds(reloadData.csv);
      applyFilters();
      alert('Someone else saved a change just now. The page has refreshed with the latest data — please redo your edit.');
      return;
    }
    if (!data.ok) throw new Error(data.error || 'save failed');
    if (flash) { flash.textContent = '\u2713 Saved'; flash.classList.remove('error'); flash.classList.add('show'); setTimeout(() => flash.classList.remove('show'), 1200); }
  } catch (err) {
    console.error('Save failed:', err);
    if (flash) { flash.textContent = '\u26a0 Save failed'; flash.classList.add('error','show'); }
  }
}

function setDbStatus(connected, text) {
  const el = document.getElementById('dbStatus');
  el.className = 'db-status ' + (connected ? 'connected' : 'disconnected');
  document.getElementById('dbStatusText').textContent = text;
  const note = document.getElementById('saveNote');
  if (!connected) {
    note.textContent = 'Cannot reach the database right now. Try reloading the page in a moment.';
    note.classList.add('warn');
  } else {
    note.classList.remove('warn');
  }
}

function handleImgError(imgEl) {
  imgEl.onerror = null;
  imgEl.style.display = 'none';
  const fallback = document.createElement('div');
  fallback.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#e8e8e8;color:#999;font-size:12px;text-align:center;padding:10px;';
  fallback.textContent = 'Image unavailable';
  imgEl.parentElement.insertBefore(fallback, imgEl);
}

function badgeClass(funnel) {
  if (funnel === 'TOF') return 'tof';
  if (funnel === 'MOF') return 'mof';
  return 'dual';
}
function statusClass(ceoApproved) { return ceoApproved ? 'approved' : 'raw'; }

function applyFilters() {
  let list = ads;
  if (currentStatus === 'CEO Approved') list = list.filter(a => a.ceoApproved);
  if (currentStatus === 'Raw Idea') list = list.filter(a => !a.ceoApproved);
  if (currentApprover === 'MK Approved') list = list.filter(a => a.mkApproved);
  if (currentApprover === 'Faezeh Approved') list = list.filter(a => a.faezehApproved);
  if (currentApprover === 'Manager Approved') list = list.filter(a => a.managerApproved);
  if (currentApprover === 'Pending Review') list = list.filter(a => !a.mkApproved && !a.faezehApproved && !a.managerApproved);
  if (currentCategory !== 'All') list = list.filter(a => a.category === currentCategory);
  renderGallery(list);
}

function approverTagsHTML(ad) {
  let tags = '';
  tags += `<span class="approver-tag ${ad.mkApproved ? 'mk' : 'pending'}">${ad.mkApproved ? '\u2713 Michael' : 'Michael'}</span>`;
  tags += `<span class="approver-tag ${ad.faezehApproved ? 'faezeh' : 'pending'}">${ad.faezehApproved ? '\u2713 Faezeh' : 'Faezeh'}</span>`;
  tags += `<span class="approver-tag ${ad.managerApproved ? 'manager' : 'pending'}">${ad.managerApproved ? '\u2713 Manager' : 'Manager'}</span>`;
  return tags;
}

function renderGallery(list) {
  const gallery = document.getElementById('gallery');
  gallery.innerHTML = '';
  if (list.length === 0) {
    gallery.innerHTML = '<div class="empty-state">No ads match this filter combination.</div>';
    document.getElementById('countLabel').textContent = '0 ads';
    return;
  }
  list.forEach(ad => {
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = () => openDetail(ad.row);
    card.innerHTML = `
      <div class="thumb">
        <span class="badge ${badgeClass(ad.funnel)}">${ad.funnel}</span>
        <span class="approval-badge ${statusClass(ad.ceoApproved)}">${ad.ceoApproved ? 'CEO Approved' : 'Raw Idea'}</span>
        <img src="${ad.hook_url}" loading="lazy" referrerpolicy="no-referrer" crossorigin="anonymous" onerror="handleImgError(this)">
      </div>
      <div class="body">
        <div class="cat">${ad.category}</div>
        <div class="hook">${ad.hook1}</div>
        <div class="approver-tags">${approverTagsHTML(ad)}</div>
        <div class="cta-preview">${ad.cta_vo}</div>
      </div>`;
    gallery.appendChild(card);
  });
  document.getElementById('countLabel').textContent = list.length + ' ads';
}

function renderStatusFilters() {
  const statuses = ['All', 'CEO Approved', 'Raw Idea'];
  const filters = document.getElementById('statusFilters');
  filters.innerHTML = '';
  statuses.forEach(status => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (status === 'All' ? ' active' : '');
    btn.textContent = status;
    btn.onclick = () => {
      currentStatus = status;
      document.querySelectorAll('#statusFilters .filter-btn').forEach(b => b.classList.remove('active','ceo-active','raw-active'));
      if (status === 'CEO Approved') btn.classList.add('ceo-active');
      else if (status === 'Raw Idea') btn.classList.add('raw-active');
      else btn.classList.add('active');
      applyFilters();
    };
    filters.appendChild(btn);
  });
}

function renderApproverFilters() {
  const opts = ['All', 'MK Approved', 'Faezeh Approved', 'Manager Approved', 'Pending Review'];
  const cls = { 'MK Approved': 'mk-active', 'Faezeh Approved': 'faezeh-active', 'Manager Approved': 'manager-active' };
  const filters = document.getElementById('approverFilters');
  filters.innerHTML = '';
  opts.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (opt === 'All' ? ' active' : '');
    btn.textContent = opt;
    btn.onclick = () => {
      currentApprover = opt;
      document.querySelectorAll('#approverFilters .filter-btn').forEach(b => b.className = 'filter-btn');
      btn.classList.add(opt === 'All' ? 'active' : (cls[opt] || 'active'));
      applyFilters();
    };
    filters.appendChild(btn);
  });
}

function renderFilters() {
  const cats = ['All', ...new Set(ads.map(a => a.category))];
  const filters = document.getElementById('filters');
  filters.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === 'All' ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = () => {
      currentCategory = cat;
      document.querySelectorAll('#filters .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      applyFilters();
    };
    filters.appendChild(btn);
  });
}

function fieldStyle(ad, field) {
  const editor = ad[field + '_editor'];
  if (editor && EDITOR_COLORS[editor]) return `style="color:${EDITOR_COLORS[editor]}"`;
  return '';
}

function fitOverlayText(el) {
  if (!el) return;
  let size = 15;
  el.style.fontSize = size + 'px';
  const maxH = 92;
  let guard = 0;
  while (el.scrollHeight > maxH && size > 9 && guard < 20) {
    size -= 1;
    el.style.fontSize = size + 'px';
    guard++;
  }
}
function fitAllOverlayText(root) {
  root.querySelectorAll('.ov .txt').forEach(fitOverlayText);
}

function onFieldEdit(row, field, el, ovId) {
  const editor = document.getElementById('editorSelect').value;
  const newText = el.innerText.trim();
  const ad = ads.find(a => a.row === row);
  ad[field] = newText;
  ad[field + '_editor'] = editor;
  el.style.color = EDITOR_COLORS[editor];
  if (ovId) {
    const ovEl = document.getElementById(ovId);
    if (ovEl) {
      ovEl.textContent = newText;
      ovEl.style.color = EDITOR_COLORS[editor];
      fitOverlayText(ovEl);
    }
  }
  queueSave(`Edit ${field} on ad ${row} (by ${editor})`);
}

function toggleApproval(row, approverField, btn) {
  const ad = ads.find(a => a.row === row);
  ad[approverField] = !ad[approverField];
  btn.classList.toggle('on', ad[approverField]);
  const name = btn.textContent.replace('\u2713 ', '');
  btn.textContent = (ad[approverField] ? '\u2713 ' : '') + name;
  queueSave(`${ad[approverField] ? 'Approve' : 'Unapprove'} ad ${row} (${approverField})`);
}

function openDetail(row) {
  const ad = ads.find(a => a.row === row);
  const doc = document.getElementById('detailDoc');
  doc.innerHTML = storyboardHTML(ad);
  document.getElementById('overlayBg').classList.add('open');
  requestAnimationFrame(() => fitAllOverlayText(doc));
}

function closeDetail() {
  document.getElementById('overlayBg').classList.remove('open');
  applyFilters();
}

document.getElementById('overlayBg').addEventListener('click', (e) => {
  if (e.target.id === 'overlayBg') closeDetail();
});

async function startApp() {
  ads = STATIC_CONFIG.map(a => ({ ...a,
    mkApproved: false, faezehApproved: false, managerApproved: false,
    h_on:'', h_vo:'', p_on:'', p_vo:'', s_on:'', s_vo:'',
    proof_on: 'Notes & photos. Invoicing. Scheduling. Reminders \u2014 all done on-site.',
    proof_vo: 'Notes, invoices, schedules and reminders \u2014 all handled without leaving the barn.',
    b_on:'', b_vo:'', cta_vo:'Meet Equinet. Try Premium free for 30 days.'
  }));
  await loadDatabase();
  renderStatusFilters();
  renderApproverFilters();
  renderFilters();
  applyFilters();
}

startApp();
</script>
